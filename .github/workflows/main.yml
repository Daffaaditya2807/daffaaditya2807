name: Generate Snake contribution graph

on:
  # Berjalan secara otomatis setiap hari (pukul 00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Berjalan secara otomatis setiap kali Anda melakukan push ke repositori ini
  push:
    branches:
      - main
  # Memungkinkan Anda menjalankan alur kerja ini secara manual dari tab Actions
  workflow_dispatch:

jobs:
  build:
    name: Generate Snake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Action yang melakukan semua pekerjaan berat
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Menentukan file output
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.dark.svg?palette=github-dark

      # Push file hasil generate ke repositori
      - name: Push results
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
